<style>
  /* COMPACT FOOTER STYLES */
  .page__footer {
    padding: 1rem 0;       /* Much smaller padding */
    margin-top: 1.5rem;    /* Closer to content above */
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #a0a0a0;
  }

  .footer-container {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;           /* Tighter spacing between elements */
    align-items: center;
  }

  /* 1. Header - Tiny & Sharp */
  .footer-title {
    font-size: 0.8rem;     /* Smaller font */
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #666;
    margin: 0;
  }

  /* 2. Icons - Compact */
  .footer-social-icons {
    display: flex;
    gap: 1rem;             /* Icons closer together */
    font-size: 1.1rem;     /* Smaller icon size */
  }

  .footer-social-icons a {
    color: #b0b0b0;
    transition: color 0.3s ease, transform 0.2s ease;
    text-decoration: none;
  }

  .footer-social-icons a:hover {
    color: #4da6ff;
    transform: translateY(2px); /* Subtle movement */
  }

  /* 3. Info Text - Small & sleek */
  .footer-info {
    font-size: 0.75rem;    /* Small, readable text */
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1rem;             /* Reduced gap between info items */
    color: #888;
  }

  .footer-info span {
    display: flex;
    align-items: center;
    gap: 0.3rem;
    white-space: nowrap;
  }

  /* 4. Powered By - Very Small */
  .footer-bottom {
    font-size: 0.7rem;
    opacity: 0.6;
    margin-top: 0.2rem;
  }
  
  .footer-bottom a {
    color: inherit;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 2px;
  }

  .footer-bottom a:hover {
    color: #4da6ff;
    text-decoration: none;
  }
</style>

<div class="footer-container">

   <!-- 1. Header -->
  <div class="footer-title">Contact Me</div>

  <!-- 2. Minimal Social Icons -->
  <div class="footer-social-icons">
    {% if site.author.github %}
      <a href="https://github.com/{{ site.author.github }}" title="GitHub">
        <i class="fab fa-github"></i>
      </a>
    {% endif %}

    {% if site.author.linkedin %}
      <a href="https://www.linkedin.com/in/{{ site.author.linkedin }}" title="LinkedIn">
        <i class="fab fa-linkedin-in"></i>
      </a>
    {% endif %}

    {% if site.author.email %}
      <a href="mailto:{{ site.author.email }}" title="Email">
        <i class="fas fa-envelope"></i>
      </a>
    {% endif %}
  </div>

  <!-- 3. Personal Info -->
  <div class="footer-info">
    <span>
      <i class="fas fa-user-circle"></i> {{ site.author.name }}
    </span>
    {% if site.author.location %}
      <span>
        <i class="fas fa-map-marker-alt"></i> {{ site.author.location }}
      </span>
    {% endif %}
    {% if site.author.employer %}
      <span>
        <i class="fas fa-university"></i> {{ site.author.employer }}
      </span>
    {% endif %}
  </div>

  <!-- 4. Credits -->
  <!-- <div class="footer-bottom">
    <p style="margin: 0;">
      Powered by <a href="https://academicpages.github.io">AcademicPages</a>
    </p>
  </div> -->

</div>
